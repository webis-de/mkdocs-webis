name: CI

on:
  push:

jobs:
  python-build:
    name: "🏗️ Build Python wheels"
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: "🧰 Install Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install build twine
      - name: "🏗️ Build Python wheels"
        run: python -m build
      - name: "🧪 Check package bundles"
        run: twine check --strict dist/*
      - name: "📤 Upload Python wheels"
        uses: actions/upload-artifact@v6
        if: matrix.python == '3.14'
        with:
          name: wheels
          path: dist
  python-code-check:
    name: "🔍 Check Python code"
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v7
      - name: "🧰 Install Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .[tests]
      - name: "🔍 Check Python code"
        run: ruff check .
  python-typing:
    name: "🔍 Check Python static typing"
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v7
      - name: "🧰 Install Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .[tests]
      - name: "🔍 Check Python static typing"
        run: mypy .
  python-test:
    name: "🧪 Test Python code"
    strategy:
      matrix:
        python:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v7
      - name: "🧰 Install Python"
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .[tests]
      - name: "🧪 Test Python code"
        run: pytest --cov --cov-report=xml .
      - name: "📤 Upload coverage to Codecov"
        uses: codecov/codecov-action@v7
        if: matrix.python == '3.14'
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
  docs-build:
    name: "📖 Build documentation"
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v7
      - name: "🧰 Install Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: "🧰 Install dependencies"
        run: pip install .
      - name: "📖 Build documentation"
        run: mkdocs build --strict
  python-publish:
    name: "🚀 Publish Python wheels"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-typing
      - python-test
      - docs-build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v7
      - name: "📥 Download Python wheels"
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist
      - name: "🚀 Publish Python wheels"
        uses: pypa/gh-action-pypi-publish@release/v1
  github-release:
    name: "🚀 Create GitHub release"
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    needs:
      - python-build
      - python-code-check
      - python-typing
      - python-test
      - docs-build
      - python-publish
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Check-out"
        uses: actions/checkout@v7
      - name: "📥 Download Python wheels"
        uses: actions/download-artifact@v8
        with:
          name: wheels
          path: dist
      - name: "🚀 Create GitHub release"
        uses: softprops/action-gh-release@v3
        with:
          name: Release ${{ github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
